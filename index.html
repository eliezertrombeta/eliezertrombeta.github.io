<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELIEZER TROMBETA</title>
    <!-- Fontes elegantes para o estilo gótico chic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #070707;
            --text-color: #e0e0e0;
            --accent-color: #6a040f;
            --nav-bg: rgba(0, 0, 0, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-top: 180px; 
        }

        /* --- HEADER COM TRANSIÇÃO --- */
        header {
            background-color: var(--nav-bg);
            padding: 1rem 5%;
            text-align: center;
            border-bottom: 1px solid #1a1a1a;
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease; 
        }

        /* --- EFEITO OURO LÍQUIDO PERMANENTE NO TÍTULO --- */
        h1.logo {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            letter-spacing: 8px;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            font-weight: 900;
            
            /* Degradê simulando tons de ouro e luz */
            background-image: linear-gradient(
                -45deg, 
                #aa7c11 0%, 
                #fceabb 25%, 
                #d4af37 50%, 
                #f8b500 75%, 
                #aa7c11 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent; /* Deixa o texto invisível para mostrar o fundo */
            animation: liquidGold 3s linear infinite; /* Movimenta o fundo como água permanentemente */
            
            transition: font-size 0.4s ease, margin 0.4s ease, letter-spacing 0.4s ease; 
            cursor: pointer;
        }

        /* Animação que faz o degradê correr pelas letras */
        @keyframes liquidGold {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        nav {
            width: 100%;
            transition: all 0.4s ease;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 3rem;
            flex-wrap: wrap;
            transition: all 0.4s ease;
        }

        nav ul li a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 400;
            transition: color 0.4s ease, text-shadow 0.4s ease;
            position: relative; /* Necessário para criar o sublinhado animado */
        }

        /* Linha invisível embaixo de cada item do menu */
        nav ul li a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -5px; /* Distância do texto */
            left: 50%;
            background-color: #d4af37;
            transition: width 0.4s ease, left 0.4s ease, background-color 0.4s ease;
            transform: translateX(-50%);
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.5); /* Brilho na linha */
        }

        nav ul li a:hover {
            color: #d4af37;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }

        /* Quando passar o mouse, a linha cresce a partir do centro */
        nav ul li a:hover::after {
            width: 100%;
        }

        /* --- CLASSE APLICADA VIA JAVASCRIPT AO ROLAR (SCROLL) --- */
        header.scrolled {
            flex-direction: row; 
            justify-content: space-between; 
            padding: 10px 5%; 
            background-color: #000000;
        }

        header.scrolled h1.logo {
            font-size: 1.5rem; 
            margin-bottom: 0;
            letter-spacing: 4px; 
        }

        header.scrolled nav {
            width: auto; 
        }

        header.scrolled nav ul {
            gap: 2rem; 
            margin-top: 0;
        }

        /* --- RESTO DO SITE --- */
        .hero {
            position: relative;
            width: 100%;
            height: 85vh;
            background: url('./imagens/home1.jpg') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.8));
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 800px;
            padding: 40 20px;
        }

        .hero-content h2 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            color: #ffffff;
            letter-spacing: 4px;
            text-shadow: 2px 4px 15px rgba(0,0,0,0.9);
        }

        .btn {
            display: inline-block;
            padding: 16px 40px;
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            letter-spacing: 3px;
            font-size: 1rem;
            text-transform: uppercase;
            transition: all 0.5s ease;
        }

        .btn:hover {
            background-color: #d4af37;
            border-color: #d4af37;
            color: #000000;
        }

        .collection {
            padding: 3rem 5%;
            text-align: center;
            background-color: #030303;
        }

        .collection h3 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            letter-spacing: 5px;
            color: #ffffff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            height: 600px;
            cursor: pointer;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            transition: transform 0.8s ease, filter 0.8s ease;
            filter: grayscale(20%) contrast(110%);
        }

        .grid-item:hover img {
            transform: scale(1.07);
            filter: grayscale(0%) contrast(120%);
        }

        .overlay {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            padding: 3rem 1rem 2rem;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        .overlay span {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            letter-spacing: 3px;
            color: #ffffff;
        }

        footer {
            background-color: #000000;
            padding: 4rem 5% 3rem;
            text-align: center;
            border-top: 1px solid #1a1a1a;
        }

        .social-container {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .social-btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #333;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
        }

        .social-btn:hover {
            border-color: #d4af37;
            background-color: #d4af37;
            color: #000000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        footer p {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #666;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header id="main-header">
        <h1 class="logo">ELIEZER TROMBETA</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="botas.html">Botas</a></li>
                <li><a href="#">Calças</a></li>
                <li><a href="#">Jaquetas</a></li>
                <li><a href="#">Camisas</a></li>
                <li><a href="#">Fragrâncias</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>A Essência da Beleza</h2>
            <a href="#" class="btn">Explorar Coleção</a>
        </div>
    </section>

    <section class="collection">
        <h3>Destaques da Temporada</h3>
        <div class="grid">
            <div class="grid-item">
                <img src="./imagens/home2.jpg" alt="Look Couro - Eliezer Trombeta">
                <div class="overlay">
                    <span>Jaquetas & Atitude</span>
                </div>
            </div>
            
            <div class="grid-item">
                <img src="./imagens/home3.jpg" alt="Retrato - Eliezer Trombeta">
                <div class="overlay">
                    <span>Identidade Visual</span>
                </div>
            </div>
            
            <div class="grid-item">
                <img src="./imagens/home4.jpg" alt="Estilo Urbano">
                <div class="overlay">
                    <span>Estilo Urbano</span>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="social-container">
            <a href="https://www.instagram.com/eliezertrombeta/" target="_blank" class="social-btn">Instagram</a>
            <a href="https://www.facebook.com/eliezer.trombeta.16/" target="_blank" class="social-btn">Facebook</a>
            <a href="https://www.tiktok.com/@eliezertrombeta" target="_blank" class="social-btn">Tiktok</a>
            <a href="https://www.youtube.com/watch?v=eRu5e6vMKjE" target="_blank" class="social-btn">Youtube</a>
        </div>
        <p>&copy; 2026 ELIEZER TROMBETA. Todos os direitos reservados.</p>
    </footer>

    <script>
        window.addEventListener('scroll', function() {
            var header = document.getElementById('main-header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
